    <body>
        <h1>Copy + Paste Link</h1>
        <meta charset="UTF-8">
     <h2>Open Site in about:blank</h2>
        <script>
            //CUSTOM ABOUT BLANKS
        function create() {
            var url = document.getElementById('input').value;
            var win = window.open();
            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';
            var iframe = win.document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.margin = '0';
            iframe.src = url;
            win.document.body.appendChild(iframe);
        }
        </script>
        <input type="text" value="" placeholder="https:./vvid.pages.dev" id='input' autofocus>
        <button onclick='create()'>Custom URL New tab</button>
        <button onclick="openGame()">This Into New Tab</button>
    <script>
        //open into new tab
        function openGame() {
            var win = window.open()
            var url = "https://skibjeffbob.github.io/AboutBlanker/"

            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            iframe.src = url
            win.document.body.appendChild(iframe)
        }
    </script>
